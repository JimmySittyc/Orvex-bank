<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Takenos Clone - Bolivia Prototype</title>
    <!-- React and Babel via CDN for immediate running -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-main: #0A0E1A;
            --bg-surface: #1E293B;
            --bg-card: #1E40AF;
            --text-primary: #FFFFFF;
            --text-secondary: #94A3B8;
            --text-muted: #64748B;
            --color-primary: #2563EB;
            --color-success: #10B981;
            --color-danger: #EF4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #030712;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text-primary);
        }

        /* Smartphone Frame Container for Web view */
        .phone-wrapper {
            width: 100%;
            max-width: 412px;
            height: 844px;
            background-color: var(--bg-main);
            border: 8px solid #27272a;
            border-radius: 40px;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .phone-content {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            padding-bottom: 90px;
        }

        /* Custom Scrollbar for Phone UI */
        .phone-content::-webkit-scrollbar {
            width: 4px;
        }
        .phone-content::-webkit-scrollbar-thumb {
            background: var(--bg-surface);
            border-radius: 10px;
        }

        /* Bottom Tab Navigation Bar */
        .nav-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 75px;
            background-color: var(--bg-surface);
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid #334155;
            padding-bottom: 10px;
            z-index: 10;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: color 0.2s;
        }

        .nav-item.active {
            color: var(--color-primary);
        }

        .nav-icon {
            font-size: 20px;
            margin-bottom: 4px;
        }

        /* Utility Styles */
        .btn-primary {
            background-color: var(--color-primary);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
        .divider { height: 1px; background-color: #334155; margin: 16px 0; }
    </style>
</head>
<body>

    <div id="root"></div>

    <script type="text/babel">
        const GLOBAL_EXCHANGE_RATE = 11.00; 

        function App() {
            const [currentScreen, setCurrentScreen] = React.useState('inicio');
            const [usdcBalance, setUsdcBalance] = React.useState(1250.00);
            const [showCardDetails, setShowCardDetails] = React.useState(false);
            const [transactions, setTransactions] = React.useState([
                { id: '1', title: 'Remittance from Remote Co.', type: 'credit', amount: 450.00 },
                { id: '2', title: 'Netflix Subscription', type: 'debit', amount: 10.99 },
                { id: '3', title: 'QR Payment: Supermercado Fidalga', type: 'debit', amount: 12.50 },
            ]);

            // Real-time calculation helpers
            const bobBalance = usdcBalance * GLOBAL_EXCHANGE_RATE;

            return (
                <div className="phone-wrapper">
                    <div className="phone-content">
                        {currentScreen === 'inicio' && (
                            <Dashboard 
                                bobBalance={bobBalance} 
                                usdcBalance={usdcBalance}
                                showCardDetails={showCardDetails}
                                setShowCardDetails={setShowCardDetails}
                                transactions={transactions}
                                changeScreen={setCurrentScreen}
                            />
                        )}
                        {currentScreen === 'depositar' && (
                            <Deposit setUsdcBalance={setUsdcBalance} setTransactions={setTransactions} />
                        )}
                        {currentScreen === 'escanear' && (
                            <ScanQR setUsdcBalance={setUsdcBalance} setTransactions={setTransactions} changeScreen={setCurrentScreen} />
                        )}
                    </div>

                    <div className="nav-bar">
                        <button className={`nav-item ${currentScreen === 'inicio' ? 'active' : ''}`} onClick={() => setCurrentScreen('inicio')}>
                            <span className="nav-icon">🏠</span>Inicio
                        </button>
                        <button className={`nav-item ${currentScreen === 'depositar' ? 'active' : ''}`} onClick={() => setCurrentScreen('depositar')}>
                            <span className="nav-icon">📥</span>Depositar
                        </button>
                        <button className={`nav-item ${currentScreen === 'escanear' ? 'active' : ''}`} onClick={() => setCurrentScreen('escanear')}>
                            <span className="nav-icon">📱</span>Escanear QR
                        </button>
                    </div>
                </div>
            );
        }

        // ==========================================
        // COMPONENTS: DASHBOARD
        // ==========================================
        function Dashboard({ bobBalance, usdcBalance, showCardDetails, setShowCardDetails, transactions, changeScreen }) {
            return (
                <div style={{animation: 'fadeIn 0.3s ease'}}>
                    <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '24px'}}>
                        <h3 style={{fontSize: '18px', fontWeight: '600'}}>Hola, Alejandro 👋</h3>
                        <div style={{background: 'var(--bg-surface)', padding: '10px', borderRadius: '50%', cursor: 'pointer'}}>🔔</div>
                    </div>

                    <div style={{marginBottom: '28px'}}>
                        <p style={{color: 'var(--text-secondary)', fontSize: '13px', marginBottom: '4px'}}>Tu balance disponible</p>
                        <h1 style={{fontSize: '36px', fontWeight: '700', letterSpacing: '-0.5px'}}>${usdcBalance.toFixed(2)} USDC</h1>
                        <h4 style={{color: 'var(--color-success)', fontSize: '16px', fontWeight: '500', marginTop: '2px'}}>≈ {bobBalance.toLocaleString('es-BO')} BOB</h4>
                    </div>

                    <div style={{display: 'flex', justifyContent: 'space-between', marginBottom: '28px'}}>
                        <button style={styles.actionBtn} onClick={() => changeScreen('depositar')}><span>➕</span><small style={styles.actionText}>Depósito</small></button>
                        <button style={styles.actionBtn} onClick={() => alert("Módulo P2P en desarrollo")}><span>💸</span><small style={styles.actionText}>Enviar</small></button>
                        <button style={styles.actionBtn} onClick={() => setShowCardDetails(!showCardDetails)}><span>💳</span><small style={styles.actionText}>Tarjeta</small></button>
                        <button style={styles.actionBtn} onClick={() => changeScreen('escanear')}><span>📱</span><small style={styles.actionText}>Escanear</small></button>
                    </div>

                    <h3 style={{fontSize: '16px', marginBottom: '12px', fontWeight: '600'}}>Tu Tarjeta Digital Global</h3>
                    <div style={styles.creditCard}>
                        <div style={{display: 'flex', justifyContent: 'space-between'}}>
                            <span style={{fontStyle: 'italic', fontWeight: '800', fontSize: '20px'}}>VISA</span>
                            <span style={{fontSize: '11px', color: '#93C5FD'}}>Prepaid</span>
                        </div>
                        <div style={{fontSize: '18px', letterSpacing: '2px', margin: '14px 0'}}>
                            {showCardDetails ? "4532 8192 0034 4832" : "••••  ••••  ••••  4832"}
                        </div>
                        <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', fontSize: '11px', color: '#93C5FD'}}>
                            <span>EXP: 12/29</span>
                            <span style={{color: '#FFF', textDecoration: 'underline', cursor: 'pointer'}} onClick={() => setShowCardDetails(!showCardDetails)}>
                                {showCardDetails ? "Ocultar" : "Ver Datos"}
                            </span>
                        </div>
                    </div>

                    <h3 style={{fontSize: '16px', marginBottom: '12px', fontWeight: '600'}}>Actividad Reciente</h3>
                    {transactions.map(tx => (
                        <div key={tx.id} style={styles.txRow}>
                            <div>
                                <p style={{fontSize: '14px', fontWeight: '500'}}>{tx.title}</p>
                                <p style={{fontSize: '11px', color: 'var(--text-muted)', marginTop: '2px'}}>{tx.type === 'credit' ? 'Ingreso Bancario' : 'Gasto Local'}</p>
                            </div>
                            <span style={{fontWeight: '600', fontSize: '15px', color: tx.type === 'credit' ? 'var(--color-success)' : 'var(--color-danger)'}}>
                                {tx.type === 'credit' ? '+' : '-'} ${tx.amount.toFixed(2)}
                            </span>
                        </div>
                    ))}
                </div>
            );
        }

        // ==========================================
        // COMPONENTS: DEPOSIT FLOW
        // ==========================================
        function Deposit({ setUsdcBalance, setTransactions }) {
            const [tab, setTab] = React.useState('local');
            const [amount, setAmount] = React.useState('');
            const [showQR, setShowQR] = React.useState(false);

            const calculatedUSDC = amount ? (parseFloat(amount) / GLOBAL_EXCHANGE_RATE).toFixed(2) : '0.00';

            const handleSimulateDeposit = () => {
                const addedUSDC = parseFloat(calculatedUSDC);
                setUsdcBalance(prev => prev + addedUSDC);
                setTransactions(prev => [
                    { id: Date.now().toString(), title: 'Carga de Fondos QR', type: 'credit', amount: addedUSDC },
                    ...prev
                ]);
                alert(`¡Éxito! Se han acreditado $${calculatedUSDC} USDC.`);
                setAmount('');
                setShowQR(false);
            };

            return (
                <div style={{animation: 'fadeIn 0.3s ease'}}>
                    <div style={styles.tabWrapper}>
                        <button style={{...styles.tabBtn, ...(tab === 'local' ? styles.activeTabBtn : {})}} onClick={() => {setTab('local'); setShowQR(false);}}>QR Boliviano</button>
                        <button style={{...styles.tabBtn, ...(tab === 'global' ? styles.activeTabBtn : {})}} onClick={() => setTab('global')}>Cuenta EE.UU.</button>
                    </div>

                    {tab === 'local' ? (
                        <div>
                            <p style={styles.inputLabel}>¿Cuánto deseas abonar en BOB?</p>
                            <div style={styles.inputBox}>
                                <input style={styles.field} type="number" placeholder="0.00" value={amount} onChange={(e) => {setAmount(e.target.value); setShowQR(false);}} />
                                <span style={{fontWeight: '700', color: 'var(--text-muted)'}}>BOB</span>
                            </div>
                            <p style={{fontSize: '11px', color: 'var(--text-muted)', marginBottom: '20px'}}>Tasa paralela: 1 USDC = {GLOBAL_EXCHANGE_RATE} BOB</p>

                            <div style={styles.conversionAlert}>
                                <p style={{fontSize: '12px', color: 'var(--text-secondary)'}}>Recibirás en tu cuenta:</p>
                                <h2 style={{color: 'var(--color-success)', marginTop: '4px'}}>${calculatedUSDC} USDC</h2>
                            </div>

                            {!showQR ? (
                                <button className="btn-primary" disabled={!amount} onClick={() => setShowQR(true)}>Generar Código QR</button>
                            ) : (
                                <div style={{textAlign: 'center', marginTop: '10px'}}>
                                    <div style={styles.qrSquare} onClick={handleSimulateDeposit}>
                                        <div style={{fontSize: '12px', fontWeight: '800'}}>CÓDIGO QR SIMPLE</div>
                                        <div style={{fontSize: '14px', color: 'var(--color-primary)', marginTop: '8px', fontWeight: 'bold'}}>{amount} BOB</div>
                                        <div style={{fontSize: '9px', color: 'var(--text-muted)', marginTop: '15px'}}>[Hacer click para simular pago bancario]</div>
                                    </div>
                                    <p style={{fontSize: '12px', color: 'var(--text-secondary)', lineHeight: '18px'}}>Captura la imagen y procésala en tu aplicación de banca móvil preferida de Bolivia.</p>
                                </div>
                            )}
                        </div>
                    ) : (
                        <div>
                            <p style={{fontSize: '13px', color: 'var(--text-secondary)', lineHeight: '20px', marginBottom: '20px'}}>Usa estos datos para transferir de forma directa remesas e ingresos desde el exterior vía ACH o Wire.</p>
                            <div style={styles.bankCardSheet}>
                                <div style={styles.bankItem}><small>BANCO RECEPTOR</small><p>Evolve Bank & Trust</p></div>
                                <div style={styles.bankItem}><small>BENEFICIARIO</small><p>Alejandro Mendoza</p></div>
                                <div style={styles.bankItem}><small>NÚMERO DE RUTA (ACH/ABA)</small><p style={{color: 'var(--color-primary)', fontWeight:'600'}}>021000021 📋</p></div>
                                <div style={styles.bankItem}><small>NÚMERO DE CUENTA</small><p style={{color: 'var(--color-primary)', fontWeight:'600'}}>123456789012 📋</p></div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // ==========================================
        // COMPONENTS: QR SCAN ENGINE
        // ==========================================
        function ScanQR({ setUsdcBalance, setTransactions, changeScreen }) {
            const [flowState, setFlowState] = React.useState('scanning');
            const costBob = 165.00;
            const costUsdc = (costBob / GLOBAL_EXCHANGE_RATE).toFixed(2);

            const executePayment = () => {
                setFlowState('processing');
                setTimeout(() => {
                    setUsdcBalance(prev => prev - parseFloat(costUsdc));
                    setTransactions(prev => [
                        { id: Date.now().toString(), title: 'Pago QR: Supermercado', type: 'debit', amount: parseFloat(costUsdc) },
                        ...prev
                    ]);
                    setFlowState('success');
                }, 1500);
            };

            return (
                <div style={{height: '100%', display: 'flex', flexDirection: 'column', animation: 'fadeIn 0.3s ease'}}>
                    {flowState === 'scanning' && (
                        <div style={{textAlign: 'center', padding: '20px 0'}}>
                            <p style={{color: 'var(--text-secondary)', fontSize: '14px', marginBottom: '40px'}}>Encuadre el código QR Simple emitido por el negocio boliviano</p>
                            <div style={styles.scannerBox}>
                                <div style={{fontSize: '11px', color: 'var(--text-muted)'}}>Buscando punto de venta...</div>
                            </div>
                            <button style={styles.simScanBtn} onClick={() => setFlowState('confirming')}>⚡ Simular Detección de QR Local</button>
                        </div>
                    )}

                    {flowState === 'confirming' && (
                        <div>
                            <h2 style={{fontSize: '20px', textAlign: 'center', marginBottom: '20px'}}>Liquidación de Compra</h2>
                            <div style={styles.invoiceSummary}>
                                <small style={{color: 'var(--text-muted)'}}>ESTABLECIMIENTO</small>
                                <p style={{fontWeight: '600', marginTop: '2px'}}>Supermercados Fidalga</p>
                                <div className="divider" />
                                <div style={{display: 'flex', justifyContent: 'space-between', margin: '8px 0'}}><span style={{color: 'var(--text-secondary)'}}>Monto del Recibo:</span><span style={{fontWeight: '600'}}>{costBob.toFixed(2)} BOB</span></div>
                                <div style={{display: 'flex', justifyContent: 'space-between', margin: '8px 0'}}><span style={{color: 'var(--text-secondary)'}}>Conversión USDC:</span><span style={{color: 'var(--color-success)', fontWeight: '700'}}>${costUsdc} USDC</span></div>
                            </div>
                            <button className="btn-primary" style={{backgroundColor: 'var(--color-success)'}} onClick={executePayment}>Confirmar Transferencia</button>
                            <button style={{background:'none', border:'none', color:'var(--text-muted)', width:'100%', marginTop:'15px', cursor:'pointer'}} onClick={() => setFlowState('scanning')}>Cancelar</button>
                        </div>
                    )}

                    {flowState === 'processing' && (
                        <div style={{textAlign: 'center', padding: '100px 0'}}>
                            <div className="spinner" style={styles.loader}></div>
                            <p style={{fontWeight: '600', marginTop: '20px'}}>Procesando Swap Interbancario...</p>
                        </div>
                    )}

                    {flowState === 'success' && (
                        <div style={{textAlign: 'center', padding: '60px 0'}}>
                            <div style={{fontSize: '54px', marginBottom: '15px'}}>✅</div>
                            <h2 style={{fontSize: '22px', fontWeight: '700'}}>¡Compra Procesada!</h2>
                            <p style={{color: 'var(--text-secondary)', fontSize: '13px', margin: '10px 0 30px', padding: '0 20px'}}>Se han deducido ${costUsdc} USDC y el comercio recibió sus {costBob} BOB instantáneamente.</p>
                            <button className="btn-primary" onClick={() => changeScreen('inicio')}>Volver a Inicio</button>
                        </div>
                    )}
                </div>
            );
        }

        // ==========================================
        // STYLING MAP FOR COMPONENTS
        // ==========================================
        const styles = {
            actionBtn: { display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', backgroundColor: 'var(--color-primary)', border: 'none', padding: '12px 0', borderRadius: '12px', width: '22%', cursor: 'pointer', color: '#FFF', fontSize: '14px' },
            actionText: { fontSize: '10px', marginTop: '6px', fontWeight: '600' },
            creditCard: { backgroundColor: 'var(--bg-card)', padding: '20px', borderRadius: '16px', display: 'flex', flexDirection: 'column', justifyContent: 'space-between', height: '145px', marginBottom: '28px', boxShadow: '0 10px 15px -3px rgba(37, 99, 235, 0.3)' },
            txRow: { display: 'flex', justifyContent: 'space-between', alignItems: 'center', backgroundColor: 'var(--bg-surface)', padding: '14px 16px', borderRadius: '12px', marginBottom: '10px' },
            tabWrapper: { display: 'flex', backgroundColor: 'var(--bg-surface)', padding: '4px', borderRadius: '8px', marginBottom: '24px' },
            tabBtn: { flex: 1, padding: '12px 0', background: 'none', border: 'none', color: 'var(--text-secondary)', fontWeight: '600', fontSize: '13px', borderRadius: '6px', cursor: 'pointer' },
            activeTabBtn: { backgroundColor: 'var(--color-primary)', color: '#FFF' },
            inputLabel: { color: 'var(--text-secondary)', fontSize: '14px', marginBottom: '8px' },
            inputBox: { display: 'flex', alignItems: 'center', backgroundColor: 'var(--bg-surface)', padding: '0 16px', borderRadius: '12px', marginBottom: '8px' },
            field: { flex: 1, background: 'none', border: 'none', color: '#FFF', fontSize: '24px', fontWeight: '700', padding: '14px 0', outline: 'none' },
            conversionAlert: { backgroundColor: '#111827', borderLeft: '4px solid var(--color-success)', padding: '14px', borderRadius: '8px', marginBottom: '28px' },
            qrSquare: { width: '180px', height: '180px', backgroundColor: '#FFF', color: '#000', margin: '20px auto', borderRadius: '12px', display: 'flex', flexDirection: 'column', justifyContent: 'center', alignItems: 'center', cursor: 'pointer', border: '4px solid var(--color-primary)' },
            bankCardSheet: { backgroundColor: 'var(--bg-surface)', padding: '20px', borderRadius: '16px' },
            bankItem: { marginBottom: '14px' },
            bankLabel: { color: 'var(--text-muted)', fontSize: '10px', display: 'block', marginBottom: '2px' },
            bankValue: { fontSize: '14px' },
            scannerBox: { width: '220px', height: '220px', border: '3px dashed var(--color-primary)', borderRadius: '24px', margin: '0 auto 30px', display: 'flex', justifyContent: 'center', alignItems: 'center' },
            simScanBtn: { backgroundColor: 'var(--bg-surface)', border: '1px solid #334155', color: '#3B82F6', padding: '12px 24px', borderRadius: '30px', fontSize: '13px', fontWeight: '600', cursor: 'pointer' },
            invoiceSummary: { backgroundColor: 'var(--bg-surface)', padding: '20px', borderRadius: '16px', marginBottom: '28px' },
            loader: { width: '40px', height: '40px', border: '4px solid var(--bg-surface)', borderTop: '4px solid var(--color-primary)', borderRadius: '50%', animation: 'spin 1s linear infinite', margin: '0 auto' }
        };

        // Standard CSS Animations added injectively
        const styleSheet = document.styleSheets[0];
        styleSheet.insertRule(`@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }`, styleSheet.cssRules.length);
        styleSheet.insertRule(`@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }`, styleSheet.cssRules.length);

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
